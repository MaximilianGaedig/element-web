name: Docker
on:
    workflow_dispatch: {}
    push:
        branches: [develop, master]
        tags: [v*]
    pull_request: {}
    schedule:
        - cron: "0 */6 * * *"
concurrency: ${{ github.workflow }}-${{ github.ref_name }}
permissions: {}
jobs:
    buildx:
        name: Docker Buildx
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            packages: write
        env:
            # Pushes (and the registry login) happen for every event except a pull request from a fork: that code is
            # not ours to publish, and its token is read-only anyway. A same-repo PR image is the preview build
            # (docs/preview.md); it is tagged below and never gets the sha or latest tags.
            PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
              with:
                  install: true

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: |
                      ghcr.io/${{ github.repository_owner }}/element-web
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix=,enable=${{ github.event_name != 'pull_request' }}
                      type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
                      type=raw,value=pr-${{ github.event.pull_request.number }}-${{ substr(github.event.pull_request.head.sha, 0, 7) }},enable=${{ github.event_name == 'pull_request' }}
                  flavor: |
                      latest=${{ (contains(github.ref_name, '-rc.') || github.event_name == 'pull_request') && 'false' || 'auto' }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              if: env.PUBLISH == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              id: build-and-push
              uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
              with:
                  context: .
                  file: apps/web/Dockerfile
                  # Upstream's Dockerfile now ends with an `element_web_modules` stage that bakes
                  # Element's own modules into the image; the fork publishes the plain app.
                  target: element_web
                  push: ${{ env.PUBLISH == 'true' }}
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
